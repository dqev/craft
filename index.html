  <style>
    :root {
      --heading: #111111;
      --body: #262626;
      --body-muted: #737373;
      --body-faint: #a1a1aa;
      --background: #ffffff;
      --card-bg: #f4f4f5;
      --card-hover-bg: #e8e8eb;
      --border: rgba(0, 0, 0, 0.06);
      --gooey-surface: #e6e6e7;
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      --duration-smooth: .15s;
      --ease-smooth: cubic-bezier(.19, 1, .22, 1);
      --selection-color: #111111;
      --selection-bg: #efefef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
    }

    ::selection {
      color: var(--selection-color);
      background: var(--selection-bg);
    }

    html,
    body {
      min-height: 100%;
      color: var(--body);
      background-color: var(--background);
    }

    body {
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-primary);
      font-size: .875rem;
      font-weight: 400;
      line-height: 1.25rem;
      letter-spacing: -.00563rem;
    }

    a {
      cursor: pointer;
      color: inherit;
      text-decoration: none;
      transition: color var(--duration-smooth) var(--ease-smooth);
    }

    /* Page Container — 100% full viewport width with corner gutters */
    .page-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 7rem 2rem 4rem;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 640px) {
      .page-container {
        padding: 1.75rem 1.25rem 2.5rem;
      }
    }

    /* Header Section — kept at standard hero max-width */
    .header-hero {
      width: 100%;
      max-width: 36.375rem;
      margin: 0 auto 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--body-muted);
      margin-bottom: 4px;
      transition: color var(--duration-smooth) var(--ease-smooth);
    }

    .back-link:hover {
      color: var(--heading);
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -.015em;
    }

    .hero-subtitle {
      font-size: .925rem;
      color: var(--body-muted);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -.00563rem;
      max-width: 440px;
    }

    /* Craft Cards Grid — 3 Columns desktop, 2 tablet, 1 mobile */
    .craft-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      transition: grid-template-columns var(--duration-smooth) var(--ease-smooth);
    }

    .craft-grid.list-view {
      grid-template-columns: 1fr !important;
      max-width: 580px;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .craft-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
    }

    @media (max-width: 640px) {
      .craft-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .project-card.craft-card {
      position: relative;
      background-color: var(--card-bg);
      border: none !important;
      box-shadow: none !important;
      padding: 48px 24px 32px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      overflow: visible !important;
      transition: background-color var(--duration-smooth) var(--ease-smooth);
    }

    .project-card.craft-card:hover {
      background-color: var(--card-bg);
    }

    .craft-card-label {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 11px;
      font-weight: 500;
      color: var(--body-faint);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
